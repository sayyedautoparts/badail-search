# Automatic Hesabate catalog sync every 2 hours.
# Server also skips 21:00–06:00 Palestine time (Asia/Jerusalem).
# Required GitHub secrets: APP_URL, CRON_SECRET (optional but recommended).
name: Hesabate catalog sync

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Hesabate sync
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ]; then
            echo "Missing GitHub secret APP_URL — skipping (Vercel cron may still run)."
            exit 0
          fi
          URL="${APP_URL%/}/hesabate/cron_sync"
          HDR=()
          if [ -n "${CRON_SECRET:-}" ]; then
            HDR=(-H "Authorization: Bearer ${CRON_SECRET}")
          fi
          echo "GET sync -> $URL"
          curl -fsS --max-time 290 -X GET "$URL" "${HDR[@]}" -o /tmp/sync.json
          head -c 2000 /tmp/sync.json
          echo
