# Automatic Hesabate catalog sync.
# GitHub schedule can drift/skip slots — use two hourly offsets for reliability.
# Server skips 21:00–06:00 Palestine time (Asia/Jerusalem).
# Required GitHub secrets: APP_URL, CRON_SECRET (optional but recommended).
name: Hesabate catalog sync

on:
  schedule:
    # كل ساعة عند الدقيقة 7 و 37 (توقيت UTC) — السيرفر يمنع التكرار الثقيل ليلاً
    - cron: "7 * * * *"
    - cron: "37 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Hesabate sync
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ]; then
            echo "::error::Missing GitHub secret APP_URL (e.g. https://badail-search.vercel.app)"
            exit 1
          fi
          URL="${APP_URL%/}/hesabate/cron_sync"
          HDR=(-H "Accept: application/json")
          if [ -n "${CRON_SECRET:-}" ]; then
            HDR+=(-H "Authorization: Bearer ${CRON_SECRET}")
          fi
          echo "GET sync -> $URL"
          HTTP_CODE=$(curl -sS --max-time 290 -o /tmp/sync.json -w "%{http_code}" -X GET "$URL" "${HDR[@]}")
          echo "HTTP $HTTP_CODE"
          head -c 2500 /tmp/sync.json || true
          echo
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::cron_sync failed with HTTP $HTTP_CODE"
            exit 1
          fi
          # فشل منطقي من السيرفر
          if grep -q '"ok"[[:space:]]*:[[:space:]]*false' /tmp/sync.json; then
            echo "::error::cron_sync returned ok=false"
            exit 1
          fi
          echo "Sync trigger OK"
