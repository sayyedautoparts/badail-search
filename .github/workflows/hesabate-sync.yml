# مزامنة كتالوج حساباتي تلقائياً — تعمل والتطبيق مغلق.
# كل 4 ساعات من 8 صباحاً إلى 8 مساءً بتوقيت فلسطين.
# صمت السيرفر: 21:00–08:00 بتوقيت فلسطين.
# Required secret: APP_URL  |  Optional: CRON_SECRET
name: Hesabate catalog sync

on:
  schedule:
    # صيف UTC+3: 05/09/13/17 UTC = 08/12/16/20 فلسطين
    # شتاء UTC+2: 07/11/15/19 محلي — السيرفر يتخطى ما قبل 08:00
    - cron: "0 5,9,13,17 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force sync even if still within min interval (1=yes)"
        required: false
        default: "0"

concurrency:
  group: hesabate-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Trigger Hesabate sync
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE_INPUT: ${{ github.event.inputs.force || '0' }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ]; then
            echo "::error::Missing GitHub secret APP_URL (e.g. https://badail-search.vercel.app)"
            exit 1
          fi
          URL="${APP_URL%/}/hesabate/cron_sync"
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ "${FORCE_INPUT}" = "1" ]; then
            URL="${URL}?force=1"
          fi
          HDR=(-H "Accept: application/json" -H "Cache-Control: no-cache")
          if [ -n "${CRON_SECRET:-}" ]; then
            HDR+=(-H "Authorization: Bearer ${CRON_SECRET}")
          fi
          echo "GET sync -> $URL"
          HTTP_CODE=$(curl -sS --max-time 290 -o /tmp/sync.json -w "%{http_code}" -X GET "$URL" "${HDR[@]}")
          echo "HTTP $HTTP_CODE"
          head -c 3000 /tmp/sync.json || true
          echo
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::cron_sync failed with HTTP $HTTP_CODE"
            exit 1
          fi
          if grep -q '"ok"[[:space:]]*:[[:space:]]*false' /tmp/sync.json; then
            echo "::error::cron_sync returned ok=false"
            exit 1
          fi
          if grep -q '"skipped"[[:space:]]*:[[:space:]]*true' /tmp/sync.json; then
            echo "Skipped (quiet hours or still fresh) — OK"
          else
            echo "Sync ran OK"
          fi
